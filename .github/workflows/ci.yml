name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  binary:
    name: single binary with the embedded web interface
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build everything
        run: make build
      - name: Smoke test the binary
        run: |
          ./bin/orxest version
          ./bin/orxest openapi --out /tmp/openapi.json
          ./bin/orxest migrate --db /tmp/ci.db
      - uses: actions/upload-artifact@v4
        with:
          name: orxest-linux-amd64
          path: bin/orxest
